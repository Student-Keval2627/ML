<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iris Flower Classifier</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; color: #18332d; background: linear-gradient(135deg, #e9f7ef, #f4f1e7); }
      main { width: min(100%, 560px); padding: 38px; border: 1px solid #d7e8dc; border-radius: 22px; background: #fff; box-shadow: 0 18px 50px #173d2d18; }
      .eyebrow { margin: 0 0 10px; color: #25815b; font-size: 0.78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 2.7rem); letter-spacing: -.04em; }
      .intro { margin: 12px 0 28px; color: #5c7168; line-height: 1.6; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      label { display: block; margin-bottom: 7px; color: #40584e; font-size: .9rem; font-weight: 650; }
      input { width: 100%; padding: 12px 13px; border: 1px solid #cfddd4; border-radius: 10px; color: #18332d; font: inherit; }
      input:focus { outline: 3px solid #bce8d1; border-color: #25815b; }
      button { width: 100%; margin-top: 22px; padding: 14px; border: 0; border-radius: 11px; color: #fff; background: #18734e; font: inherit; font-weight: 750; cursor: pointer; }
      button:hover { background: #105f40; }
      .result, .error { margin: 20px 0 0; padding: 15px 17px; border-radius: 12px; }
      .result { color: #145b3d; background: #e9f7ef; }
      .result strong { display: block; margin-top: 3px; font-size: 1.4rem; }
      .error { color: #9b2c2c; background: #fff0ef; }
      .units { margin: 18px 0 0; color: #74847c; font-size: .82rem; }
      @media (max-width: 480px) { main { padding: 26px 20px; } .grid { gap: 12px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A tiny machine learning demo</p>
      <h1>Iris classifier</h1>
      <p class="intro">Enter the flower’s four measurements and the model will predict its species.</p>
      <form method="post">
        <div class="grid">
          <div>
            <label for="sepal_length">Sepal length</label>
            <input id="sepal_length" name="sepal_length" type="number" step="any" min="0.01" value="{{ values[0] }}" required>
          </div>
          <div>
            <label for="sepal_width">Sepal width</label>
            <input id="sepal_width" name="sepal_width" type="number" step="any" min="0.01" value="{{ values[1] }}" required>
          </div>
          <div>
            <label for="petal_length">Petal length</label>
            <input id="petal_length" name="petal_length" type="number" step="any" min="0.01" value="{{ values[2] }}" required>
          </div>
          <div>
            <label for="petal_width">Petal width</label>
            <input id="petal_width" name="petal_width" type="number" step="any" min="0.01" value="{{ values[3] }}" required>
          </div>
        </div>
        <button type="submit">Predict species</button>
      </form>
      {% if prediction %}<section class="result" aria-live="polite">Predicted species<strong>{{ prediction }}</strong></section>{% endif %}
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <p class="units">All measurements are in centimeters.</p>
    </main>
  </body>
</html>
